<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호주 자유여행 가이드</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#16202e;--sub:#5b6879;--line:#e3e8ef;--pri:#1d6fe0;--pri-soft:#e3eefd;--warn-bg:#fff7e0;--warn:#8a5a00;--hdr1:#0f4fc4;--hdr2:#0aa0c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--card:#171f29;--ink:#e8eef6;--sub:#9aa8b9;--line:#263140;--pri:#5aa2ff;--pri-soft:#17304f;--warn-bg:#352a10;--warn:#f0c46a}}
:root[data-theme="dark"]{--bg:#0e141b;--card:#171f29;--ink:#e8eef6;--sub:#9aa8b9;--line:#263140;--pri:#5aa2ff;--pri-soft:#17304f;--warn-bg:#352a10;--warn:#f0c46a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;line-height:1.55;padding-bottom:48px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:26px 0 20px}
header h1{font-size:22px;font-weight:800}
header p{font-size:13px;opacity:.92;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
.chip{flex:none;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:7px 11px;font-size:12px}
.chip b{display:block;font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;scrollbar-width:none;max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--sub);font:600 13px inherit;font-family:inherit;padding:8px 14px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff}
main{padding-top:14px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.day-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dn{background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:12px;padding:3px 9px;border-radius:7px}
.dd{font-size:12px;color:var(--sub)}
.dt{font-weight:800;font-size:15px;margin-left:auto}
.tl{list-style:none;border-left:2px solid var(--line);margin-left:4px;padding-left:12px}
.tl li{position:relative;padding:5px 0;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-18px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.tm{display:block;font-size:11.5px;font-weight:700;color:var(--pri)}
.sub-h{font-weight:800;font-size:14px;margin:4px 0 8px}
.row{font-size:13px;color:var(--sub);margin-top:3px}.row b{color:var(--ink)}
.tag{display:inline-block;background:var(--pri-soft);color:var(--pri);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px}
.stay-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.price{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-weight:700;font-size:13px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.item:last-child{border:0}
.item input{margin-top:4px;width:17px;height:17px;accent-color:var(--pri);flex:none}
.item .q{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;flex:none;max-width:42%}
.info p{font-size:13.5px;margin-top:6px}
.bank{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:10px;padding:11px 12px;margin-top:10px;font-size:14px;font-weight:700}
.cp{flex:none;border:0;background:#fff;color:#0f4fc4;font:700 12px inherit;font-family:inherit;padding:6px 12px;border-radius:8px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding-top:10px;margin-top:4px;border-top:2px solid var(--line)}
.amt{margin-left:auto;font-weight:700;font-size:13px;flex:none;padding-left:10px;text-align:right}
.mapbox{position:relative;overflow:hidden}.mapbox svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.zc{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}.zc button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:8px;color:var(--sub)}.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.dtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.dtabs::-webkit-scrollbar{display:none}
.db{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 12.5px inherit;font-family:inherit;padding:6px 13px;border-radius:99px;cursor:pointer}.db.on{background:var(--c,var(--pri));color:#fff;border-color:transparent}
.all text.mk,.all text.lb{display:none}.all circle.mk{r:5}
.sea{fill:#d6e9f6}.ld{fill:#f1f3e6;stroke:#6f9fc4;stroke-width:1.8;stroke-linejoin:round}.wt{fill:none;stroke:#bcdcf1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sea{fill:#10202e}:root:not([data-theme="light"]) .ld{fill:#1d2a24;stroke:#3a6a8c}:root:not([data-theme="light"]) .wt{stroke:#1f4a68}}
:root[data-theme="dark"] .sea{fill:#10202e}:root[data-theme="dark"] .ld{fill:#1d2a24;stroke:#3a6a8c}:root[data-theme="dark"] .wt{stroke:#1f4a68}
.mapbox{border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(15,40,80,.08)}
.zm{flex:none;border:1px dashed var(--line);background:var(--card);color:var(--sub);font:700 12.5px inherit;font-family:inherit;padding:6px 12px;border-radius:99px;cursor:pointer}
.foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:18px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>🇦🇺 호주 자유여행 가이드</h1>
<p>2월 4일(목) ~ 2월 17일(수) · 시드니 · 멜버른 · 호바트 · 퍼스 · 싱가포르 경유</p>
<div class="chips">
<div class="chip">시드니·멜버른·호바트<b>서울 +2시간</b></div>
<div class="chip">퍼스·싱가포르<b>서울 -1시간</b></div>
<div class="chip">통화<b>호주 달러(AUD)</b></div>
<div class="chip">플러그<b>I형 (삼각 3구)</b></div>
</div></div></header>

<nav><div class="tabs" id="tabs">
<button class="tab on" data-t="plan">📅 일정</button>
<button class="tab" data-t="stay">🏨 숙소</button>
<button class="tab" data-t="pack">🎒 준비물</button>
<button class="tab" data-t="info">🌤️ 여행정보</button>
<button class="tab" data-t="food">🍽️ 맛집·패스</button>
<button class="tab" data-t="budget">💰 예산</button>
<button class="tab" data-t="pay">🧾 정산</button>
<button class="tab" data-t="route">🗺️ 이동경로</button>
</div></nav>

<main class="wrap">
<section class="pane on" id="p-plan"></section>
<section class="pane" id="p-stay"></section>
<section class="pane" id="p-pack"></section>
<section class="pane" id="p-info"></section>
<section class="pane" id="p-food"></section>
<section class="pane" id="p-budget"></section>
<section class="pane" id="p-pay"></section>
<section class="pane" id="p-route"></section>
<p class="foot">구글 시트 「호주여행정보 &amp; 예산」 기준으로 정리한 페이지입니다.</p>
</main>

const zoomable=(box,svg)=>{

 const cl=()=>{w=Math.min(W,Math.max(W/6,w));h=w*H/W;x=Math.min(vb[0]+W-w,Math.max(vb[0],x));y=Math.min(vb[1]+H-h,Math.max(vb[1],y))};
 const zoomAt=(f,px,py)=>{const nw=Math.min(W,Math.max(W/6,w/f)),r=nw/w;x=px-(px-x)*r;y=py-(py-y)*r;w=nw;h=w*H/W;cl();ap()};

 const rs=()=>{x=vb[0];y=vb[1];w=W;h=H;ap()};

 box.insertAdjacentHTML('beforeend',`<div class='zc'><button data-z='in' aria-label='확대'>＋</button><button data-z='out' aria-label='축소'>－</button><button data-z='0' aria-label='처음 크기로'>⟲</button></div>`);
 box.querySelectorAll('.zc button').forEach(b=>b.addEventListener('click',()=>{const z=b.dataset.z;if(z==='0'){rs()}else{zoomAt(z==='in'?1.6:1/1.6,x+w/2,y+h/2)}}));
 const P=new Map();let d0=0;
 svg.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const a=[...P.values()];d0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
 svg.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
  if(P.size===1&&w<W-1){const r=svg.getBoundingClientRect();x-=(e.clientX-p[0])*w/r.width;y-=(e.clientY-p[1])*h/r.height;cl();ap()}
  else if(P.size===2){const o=[...P.entries()].find(([k])=>k!==e.pointerId)[1];const d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);if(d0>0){const m=toVB((e.clientX+o[0])/2,(e.clientY+o[1])/2);zoomAt(d1/d0,m[0],m[1])}d0=d1}
  P.set(e.pointerId,[e.clientX,e.clientY])});

 return rs;
};
